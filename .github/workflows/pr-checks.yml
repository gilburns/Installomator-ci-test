name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job diffs the PR merge commit against its first parent (the base branch),
# so only files changed by the pull request are checked.

jobs:
  line-endings:
    name: Line endings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check final LF and CRLF in changed text files
        run: |
          git rev-parse --verify -q HEAD^2 >/dev/null || { echo "::error::Expected a pull request merge commit"; exit 1; }

          esc() { local s=${1//%/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}; s=${s//:/%3A}; printf '%s' "${s//,/%2C}"; }
          help="Please review Contributing to Installomator (https://github.com/Installomator/Installomator/wiki/Contributing-to-Installomator). We recommend installing/using an EditorConfig plugin for your editor."

          failed=0
          checked=0
          while IFS=$'\t' read -r -d '' added deleted file; do
            [ "$added" = "-" ] && continue
            case "$file" in fragments/labels/*) continue ;; esac
            [ -s "$file" ] || continue
            checked=$((checked + 1))
            if [ -n "$(tail -c 1 "$file")" ]; then
              echo "::error file=$(esc "$file")::The file does not end with an LF control character. $help"
              failed=1
            fi
            if grep -q $'\r' "$file"; then
              echo "::error file=$(esc "$file")::The file contains CRLF line endings; use LF only. $help"
              failed=1
            fi
          done < <(git diff -z --numstat --no-renames --diff-filter=d HEAD^1 HEAD)

          echo "Checked $checked changed text file(s) outside fragments/labels (labels are checked by Label lint)."
          exit $failed

  generated-files:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check that Installomator.sh and Labels.txt are not edited directly
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git rev-parse --verify -q HEAD^2 >/dev/null || { echo "::error::Expected a pull request merge commit"; exit 1; }

          case "$HEAD_REF" in
            auto/assemble-*)
              if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
                echo "Automated assemble branch; generated files may change."
                exit 0
              fi
              ;;
          esac

          failed=0
          for file in Installomator.sh Labels.txt; do
            if ! git diff --quiet HEAD^1 HEAD -- "$file"; then
              echo "::error file=$file::$file is generated by utils/assemble.sh and must not be edited in a pull request. Put changes in fragments/ (labels in fragments/labels/) and revert $file. See CONTRIBUTING.md."
              failed=1
            fi
          done
          [ $failed -eq 0 ] && echo "Installomator.sh and Labels.txt are unchanged."
          exit $failed

  label-lint:
    name: Label lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Find changed labels
        id: labels
        run: |
          git rev-parse --verify -q HEAD^2 >/dev/null || { echo "::error::Expected a pull request merge commit"; exit 1; }

          list="$RUNNER_TEMP/labels.list"
          : > "$list"
          count=0
          invalid=0
          while IFS= read -r -d '' file; do
            if [[ "$file" =~ ^fragments/labels/[A-Za-z0-9._-]+\.sh$ ]]; then
              printf '%s\0' "$file" >> "$list"
              count=$((count + 1))
            else
              echo "::error::Unexpected file in fragments/labels (labels must be fragments/labels/<label>.sh): ${file//[^A-Za-z0-9._\/ -]/?}"
              invalid=$((invalid + 1))
            fi
          done < <(git diff -z --name-only --no-renames --diff-filter=d HEAD^1 HEAD -- fragments/labels/)

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "invalid=$invalid" >> "$GITHUB_OUTPUT"
          echo "Changed labels: $count"

      - name: Install zsh and gawk
        if: steps.labels.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh gawk

      - name: Lint changed labels
        if: steps.labels.outputs.count != '0'
        env:
          AWK: gawk
        run: |
          # Use the linter from the base branch so a pull request cannot relax
          # its own checks; fall back to the PR copy when the base has none.
          linter="$RUNNER_TEMP/lint_label.sh"
          git show HEAD^1:utils/lint_label.sh > "$linter" 2>/dev/null || cp utils/lint_label.sh "$linter"
          if ! git diff --quiet HEAD^1 HEAD -- utils/lint_label.sh; then
            echo "::notice file=utils/lint_label.sh::This PR changes the linter; labels are checked with the base branch version."
          fi

          report="$RUNNER_TEMP/lint.txt"
          xargs -0 bash "$linter" < "$RUNNER_TEMP/labels.list" > "$report" 2>&1 || true
          {
            echo "## Label lint"
            echo
            echo "ERROR fails the check. WARN and INFO are for review; please fix them while you are editing the label."
            echo
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

          xargs -0 bash "$linter" -g < "$RUNNER_TEMP/labels.list"

      - name: Fail on unexpected files in fragments/labels
        if: always() && steps.labels.outputs.invalid != '0'
        run: exit 1
